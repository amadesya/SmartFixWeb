<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartFix: Repair Request Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind собирается через Vite + tailwind.config.js -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Roboto"', '"Exo 2"', "sans-serif"],
            },
            colors: {
              "smartfix-darkest": "#051F20",
              "smartfix-darker": "#0B2B26",
              "smartfix-dark": "#163832",
              "smartfix-medium": "#235347",
              "smartfix-light": "#8EB69B",
              "smartfix-lightest": "#DAF1DE",
            },
          },
        },
      };
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/"
        }
      }
    </script>
        <script>
          (function () {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
            document.documentElement.classList.add(theme);
          })();
        </script>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="src/index.tsx"></script>
  </body>
</html>
