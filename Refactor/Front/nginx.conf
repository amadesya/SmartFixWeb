server {
    listen 80;
    server_name localhost;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. Точечные заглушки и статика React
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ПРЯМАЯ РАЗДАЧА АВАТАРОК В ОБХОД БЭКЕНДА
    location /avatars/ {
        root /usr/share/nginx/html; # Nginx будет искать файлы в /usr/share/nginx/html/avatars/
        expires 30d;                # Кешируем аватарки в браузере пользователя на 30 дней
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }    
    # ПРЯМАЯ РАЗДАЧА ИЗОБРАЖЕНИЙ/ФАЙЛОВ УСЛУГ В ОБХОД БЭКЕНДА
    location /services/ {
        root /usr/share/nginx/html; # Nginx будет искать файлы в /usr/share/nginx/html/services/
        expires 30d;                # Кешируем файлы услуг в браузере пользователя на 30 дней
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
        # ПРЯМАЯ РАЗДАЧА ИЗОБРАЖЕНИЙ/ФАЙЛОВ УСЛУГ В ОБХОД БЭКЕНДА
    location /uploads/ {
        root /usr/share/nginx/html; # Nginx будет искать файлы в /usr/share/nginx/html/services/
        expires 30d;                # Кешируем файлы услуг в браузере пользователя на 30 дней
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }


    # 3. SignalR Hub (Специфичный прокси ставим ВЫШЕ общего /api/)
    location /api/notificationHub {
        proxy_pass http://backend:80; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_cache_bypass;
    }

    # 4. Общее проксирование запросов к API бэкенда
    location /api/ {
        proxy_pass http://157.22.205.103:8080; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ошибки
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}